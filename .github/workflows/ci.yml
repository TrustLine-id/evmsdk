# CI: compile the contracts, build the JS bundle and run the Hardhat test suite
# on every pull request and on pushes to master.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The job name is the required status check on the default branch (org ruleset
    # "SOC2 - protect default branch"). Keep it "test" in every repository.
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          # No lockfile is committed in this repository (package-lock.json is gitignored).
          cache-dependency-path: package.json

      # `npm ci` requires a committed lockfile; fall back to `npm install`.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
